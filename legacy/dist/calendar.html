<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Календарь (макет для скриншота)</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { background: #f7f8fa; margin: 0; padding: 0; }
    .cal-shell { max-width: 1100px; margin: 16px auto; padding: 16px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cal-header h2 { font-size: 18px; margin: 0; }
    .cal-tabs button { background: none; border: 1px solid #e5e7eb; padding: 6px 14px; border-radius: 4px; cursor: pointer; margin-left: 4px; font-size: 13px; }
    .cal-tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; color: #6b7280; padding: 4px; text-transform: uppercase; }
    .cal-day { aspect-ratio: 1.2; border: 1px solid #f3f4f6; padding: 4px; font-size: 12px; position: relative; min-height: 60px; }
    .cal-day.muted { color: #d1d5db; background: #fafafa; }
    .cal-day .num { font-weight: 600; }
    .cal-day .dots { margin-top: 4px; display: flex; gap: 2px; flex-wrap: wrap; }
    .cal-day .dot { width: 6px; height: 6px; border-radius: 50%; }
    .cal-day.selected { background: #eff6ff; border-color: #2563eb; }
    .cal-day.today .num { color: #2563eb; }
    .cal-day.has { background: #fefce8; }
    .cal-day.tooltip { background: #f0f9ff; }
    .cal-list { margin-top: 16px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
    .cal-list h4 { font-size: 13px; margin: 0 0 8px 0; color: #6b7280; }
    .item-row { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
    .item-row:hover { background: #f9fafb; }
    .item-row .time { color: #6b7280; margin-right: 12px; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="cal-shell">
    <div class="cal-header">
      <h2>📅 Октябрь 2026</h2>
      <div class="cal-tabs">
        <button>День</button>
        <button>Неделя</button>
        <button class="active">Месяц</button>
      </div>
    </div>

    <div class="cal-grid">
      <div class="cal-dow">Пн</div><div class="cal-dow">Вт</div><div class="cal-dow">Ср</div>
      <div class="cal-dow">Чт</div><div class="cal-dow">Пт</div><div class="cal-dow">Сб</div><div class="cal-dow">Вс</div>

      <div class="cal-day muted"><span class="num">28</span></div>
      <div class="cal-day muted"><span class="num">29</span></div>
      <div class="cal-day muted"><span class="num">30</span></div>
      <div class="cal-day has"><span class="num">1</span><div class="dots"><span class="dot" style="background:#2563eb"></span><span class="dot" style="background:#16a34a"></span></div></div>
      <div class="cal-day"><span class="num">2</span></div>
      <div class="cal-day muted"><span class="num">3</span></div>
      <div class="cal-day muted"><span class="num">4</span></div>

      <div class="cal-day"><span class="num">5</span></div>
      <div class="cal-day has"><span class="num">6</span><div class="dots"><span class="dot" style="background:#2563eb"></span></div></div>
      <div class="cal-day has today"><span class="num">7</span><div class="dots"><span class="dot" style="background:#2563eb"></span><span class="dot" style="background:#16a34a"></span><span class="dot" style="background:#ea580c"></span></div></div>
      <div class="cal-day"><span class="num">8</span></div>
      <div class="cal-day has"><span class="num">9</span><div class="dots"><span class="dot" style="background:#9333ea"></span></div></div>
      <div class="cal-day muted"><span class="num">10</span></div>
      <div class="cal-day muted"><span class="num">11</span></div>

      <div class="cal-day has"><span class="num">12</span><div class="dots"><span class="dot" style="background:#2563eb"></span></div></div>
      <div class="cal-day selected has"><span class="num">13</span><div class="dots"><span class="dot" style="background:#2563eb"></span><span class="dot" style="background:#16a34a"></span></div></div>
      <div class="cal-day"><span class="num">14</span></div>
      <div class="cal-day has"><span class="num">15</span><div class="dots"><span class="dot" style="background:#ea580c"></span></div></div>
      <div class="cal-day"><span class="num">16</span></div>
      <div class="cal-day muted"><span class="num">17</span></div>
      <div class="cal-day muted"><span class="num">18</span></div>

      <div class="cal-day has"><span class="num">19</span><div class="dots"><span class="dot" style="background:#2563eb"></span></div></div>
      <div class="cal-day"><span class="num">20</span></div>
      <div class="cal-day has"><span class="num">21</span><div class="dots"><span class="dot" style="background:#16a34a"></span><span class="dot" style="background:#9333ea"></span></div></div>
      <div class="cal-day"><span class="num">22</span></div>
      <div class="cal-day has"><span class="num">23</span><div class="dots"><span class="dot" style="background:#2563eb"></span></div></div>
      <div class="cal-day muted"><span class="num">24</span></div>
      <div class="cal-day muted"><span class="num">25</span></div>

      <div class="cal-day"><span class="num">26</span></div>
      <div class="cal-day has"><span class="num">27</span><div class="dots"><span class="dot" style="background:#ea580c"></span></div></div>
      <div class="cal-day has"><span class="num">28</span><div class="dots"><span class="dot" style="background:#2563eb"></span><span class="dot" style="background:#16a34a"></span></div></div>
      <div class="cal-day"><span class="num">29</span></div>
      <div class="cal-day has"><span class="num">30</span><div class="dots"><span class="dot" style="background:#2563eb"></span></div></div>
      <div class="cal-day muted"><span class="num">31</span></div>
      <div class="cal-day muted"><span class="num">1</span></div>
    </div>

    <div class="cal-list">
      <h4>13 октября (3 встречи)</h4>
      <div class="item-row"><span><span class="time">09:30</span>Планёрка команды</span><span>5 участников</span></div>
      <div class="item-row"><span><span class="time">14:00</span>Заказчик «Альфа» — бюджет Q4</span><span>3 участника</span></div>
      <div class="item-row"><span><span class="time">16:30</span>Ретроспектива спринта</span><span>8 участников</span></div>
    </div>
  </div>
</body>
</html>
