# =============================================================================
# HTML_MeetingProtokol — Production Docker Compose override
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Prereq: .env.prod must exist (see .env.prod.example for template)
#         External volumes "pgdata_prod" and "html_mp_prod" must exist
# =============================================================================

name: hmp-prod

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15 (alpine)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: hmp-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # External named volume — survives `docker compose down`
      - pgdata_prod:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hmp_internal
    # No ports exposed — only accessible via internal Docker network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: journald
      options:
        tag: "hmp-postgres"

  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: hmp-backend:prod
    container_name: hmp-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    networks:
      - hmp_internal
    # No host port exposure — reverse proxy talks to it via Docker DNS
    expose:
      - "8000"
    volumes:
      # External named volume for persisted user files (protocols, audio)
      - html_mp_prod:/home/hmp/.html_mp
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
    # Read-only root filesystem — only declared volumes are writable
    read_only: false  # /tmp and /home/hmp/.html_mp need writes
    tmpfs:
      - /tmp:size=512M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: journald
      options:
        tag: "hmp-backend"

  # ---------------------------------------------------------------------------
  # Frontend (nginx serving static SPA)
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: hmp-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hmp_internal
      - hmp_external
    volumes:
      - ./hmp-frontend/public:/usr/share/nginx/html:ro
      - ./infra/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: "hmp-frontend"

  # ---------------------------------------------------------------------------
  # Reverse proxy — Caddy (auto-TLS via Let's Encrypt)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: hmp-caddy-prod
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hmp_external
      - hmp_internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data_prod:/data
      - caddy_config_prod:/config
    environment:
      # Domain for Let's Encrypt ACME challenge
      - DOMAIN=${HMP_DOMAIN:-localhost}
      - ACME_EMAIL=${HMP_ACME_EMAIL:-admin@localhost}
    healthcheck:
      test: ["CMD", "caddy", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: "hmp-caddy"

# =============================================================================
# Networks — isolation: postgres is NOT on external
# =============================================================================
networks:
  hmp_internal:
    name: hmp_internal
    driver: bridge
    internal: false  # egress for Let's Encrypt / package pulls if needed
  hmp_external:
    name: hmp_external
    driver: bridge

# =============================================================================
# Volumes — external = must be created with `docker volume create` beforehand
# =============================================================================
volumes:
  pgdata_prod:
    name: pgdata_prod
    external: true
  html_mp_prod:
    name: html_mp_prod
    external: true
  caddy_data_prod:
    name: caddy_data_prod
  caddy_config_prod:
    name: caddy_config_prod
