[project]
name = "hmp-backend"
version = "1.0.0"
description = "Backend for HTML_MeetingProtokol - local meeting protocols app"
authors = [{name = "Алексей Краюшкин"}]
license = {text = "Proprietary"}
requires-python = ">=3.10"

dependencies = [
    # Web framework (ADR-001)
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",  # multipart/form-data

    # Database (ADR-002)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",

    # Auth & Security (ADR-014)
    "cryptography>=43.0.0",  # AES-256-GCM
    "pyjwt>=2.9.0",

    # ML / Transcription (ADR-005)
    "faster-whisper>=1.0.0",
    "torch>=2.4.0",  # pyannote dependency
    "pyannote.audio>=3.1.1",

    # LLM clients (ADR-004)
    "httpx>=0.27.0",
    "openai>=1.50.0",  # Hermes uses OpenAI-compatible API

    # Observability (NFR §13)
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",

    # DOCX export (ADR-011)
    "python-docx>=1.1.0",
    "pillow>=10.4.0",

    # Resource monitoring (NFR §QG-7)
    "psutil>=6.1.0",

    # Utilities
    "tenacity>=9.0.0",  # Retry logic
    "orjson>=3.10.0",  # Fast JSON
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # TestClient
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "locust>=2.32.0",  # Load testing
]

[project.scripts]
hmp-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "ICN", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PL"]
ignore = ["E501", "PLR0913"]  # line-too-long, too-many-args (handled case by case)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "PLR2004"]  # Magic values OK in tests
"alembic/**/*.py" = ["E", "F"]  # Alembic auto-generated

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
