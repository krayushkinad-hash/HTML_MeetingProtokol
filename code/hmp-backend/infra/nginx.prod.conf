# =============================================================================
# HMP Frontend — Production nginx config (SPA + reverse proxy)
# =============================================================================
# Drop into:  hmp-backend/infra/nginx.prod.conf
# Mounted at: /etc/nginx/conf.d/default.conf
# Serves:     hmp-frontend/public/  (mounted at /usr/share/nginx/html)
# Proxies:    /api/*  →  backend:8000
# =============================================================================

# Upstream — Docker service name resolves via internal DNS
upstream hmp_backend {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

# Limit request body for upload endpoints (default 10 GB)
client_max_body_size 10240m;

# Long timeouts for transcription / upload
proxy_connect_timeout 60s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;
send_timeout          600s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Security headers (CSP tightened — adjust if you add inline scripts)
    # -----------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://hmp.example.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    # HSTS — only enable when HTTPS terminated upstream (Caddy) — see Caddyfile
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml
        font/ttf
        font/otf;

    # -----------------------------------------------------------------------
    # API proxy — /api/*  → backend:8000
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://hmp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers on;
    }

    # Health endpoint exposed by backend
    location = /health {
        proxy_pass http://hmp_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # Versioned static assets — long cache (1 year, immutable)
    # -----------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|svg|webp|avif|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    # HTML — never cache (SPA shells may update)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # SPA routing — fall back to index.html
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
