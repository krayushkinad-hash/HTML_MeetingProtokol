name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hmp
          POSTGRES_PASSWORD: hmp_password
          POSTGRES_DB: html_mp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          cd code/hmp-backend
          pip install -r requirements-minimal.txt
          pip install pytest pytest-asyncio httpx pillow imagehash

      - name: Run linter
        run: |
          cd code/hmp-backend
          pip install ruff
          ruff check app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://hmp:hmp_password@localhost:5432/html_mp_test
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          cd code/hmp-backend
          pytest tests/ -v
